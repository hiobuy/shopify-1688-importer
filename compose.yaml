services:
  importer:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/importer.sqlite
      PORT: "3000"
    volumes:
      - importer-data:/data
    restart: unless-stopped
    init: true
volumes:
  importer-data:
